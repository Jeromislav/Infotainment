<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <style>
    body{background:#111;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;}
    .box{width:350px;padding:20px;background:#1b1b1b;border-radius:12px;}
    input{width:93%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f0f0f;color:#fff;}
    button{width:99%;padding:10px;border:0;border-radius:8px;background:#2d7dff;color:#fff;font-weight:bold;cursor:pointer;}
    a{color:#9ec3ff;}
    .err{color:#ff8c8c;margin-top:8px;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Registracija</h2>
    <form method="post" action="/register">
      <input name="username" placeholder="Korisničko ime" autocomplete="username" required>
      <input name="password" type="password" placeholder="Lozinka" autocomplete="new-password" required>
      <button type="submit" style="margin-top: 8px;">Napravi račun</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <p style="margin-top:20px;"><a href="/login">Nazad na prijavu</a></p>
  </div>
</body>
</html>
